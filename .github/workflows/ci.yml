# .github/workflows/ci.yml
#
# SwiftWebUI CI matrix. Runs on every PR and on every push to `main`.
#
# Owned by swiftwebui-tooling. The swiftwebui-steward rein takes over
# the workflow's placement (OSS-level ownership of the `.github/`
# tree) in a future integration pass; the workflow body itself
# remains a tooling concern.
#
# Stop condition (per AGENTS.md tooling scope): the workflow exists,
# the path-hygiene guard is wired in, `xcodebuild build-for-testing`
# and `xcodebuild test-without-building` pass on the host triple, and
# the job is green on a test PR.
#
# This iteration runs on `macos-26` (Xcode 26.4.1 = default, Swift
# 6.3.1) and uses `xcodebuild` against the SwiftPM-generated scheme
# `swift-web-ui`. Why xcodebuild, not swift-actions/setup-swift:
#   - `swift-actions/setup-swift@v3` shells out to `swiftly install`,
#     which on the older `macos-14` runner silently crashes (the
#     step is reported green but the toolchain on disk is unchanged).
#     See the agent's MEMORY.md entry `swift-actions/setup-swift@v3
#     crashes on macos-14 runners`.
#   - Xcode 26.4.1 ships Swift 6.3.1, which is the version we want
#     anyway (matches the version that ships JavaScriptKit 0.54.1
#     and `swift-tools-version:6.0`).
#   - `xcodebuild` against a SwiftPM package produces a deterministic
#     `swift-web-ui` scheme with no `.xcworkspace` required; the
#     derived-data cache key covers Package.swift + Sources/ + Tests/
#     for incremental re-runs.
#
# Ubuntu is intentionally not in the matrix yet: JavaScriptKit's
# wasm32 SDK is not preinstalled on `ubuntu-latest` and is wired up
# in a later phase (the renderer/bridge deliverable lands first).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host (macos-26, Xcode 26.4.1 / Swift 6.3.1)
    runs-on: macos-26
    timeout-minutes: 45

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/.build/derived-data
      SCHEME: swift-web-ui-Package
      DESTINATION: platform=macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Set IgnoreFileSystemDeviceInodeChanges flag
        # Speeds up incremental builds by letting Xcode skip inode
        # comparisons on the runner's APFS volume. Same flag TCA sets.
        run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Update mtime for incremental builds
        # Many SPM build artifacts key off mtime rather than inode;
        # restoring mtime from git timestamps avoids spurious rebuilds
        # when the runner's checkout is fresh.
        uses: chetan/git-restore-mtime-action@v2

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: |
            deriveddata-xcodebuild-${{ env.SCHEME }}-${{ env.DESTINATION }}-${{ hashFiles('**/Package.swift', '**/Sources/**/*.swift', '**/Tests/**/*.swift') }}
          restore-keys: |
            deriveddata-xcodebuild-${{ env.SCHEME }}-${{ env.DESTINATION }}-

      - name: Path-hygiene guard
        # AGENTS.md §10: tracked docs must use repo-relative paths
        # only. The guard returns non-zero on any forbidden pattern.
        # Owned by swiftwebui-tooling.
        run: bash scripts/lint-paths.sh

      - name: xcodebuild build-for-testing
        # Compile the package + tests into the derived data. The
        # matching `test-without-building` step runs the suite against
        # the same artifacts, so a flake in test logic does not
        # re-trigger the (slow) full build. SPM uses the default
        # package cache (~/Library/Caches/org.swift.swiftpm), which
        # is what we want — `-clonedSourcePackagesDirPath` is for
        # hybrid SPM/Xcode projects and confuses pure-SwiftPM builds.
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipMacroValidation \
            build-for-testing

      - name: xcodebuild test-without-building
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipMacroValidation \
            test-without-building

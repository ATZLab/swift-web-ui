# .github/workflows/ci.yml
#
# SwiftWebUI CI matrix. Runs on every PR and on every push to `main`.
#
# Owned in this iteration by swiftwebui-tooling. The
# swiftwebui-steward rein takes over the workflow's placement
# (OSS-level ownership of the `.github/` tree) in the next
# integration pass; the workflow body itself remains a
# tooling/tester concern.
#
# Stop condition (per AGENTS.md tooling scope): the workflow exists,
# the path-hygiene guard is wired in, `swift build` and `swift test`
# pass on the host triple, and the job is green on a test PR.
#
# This iteration deliberately runs on `macos-14` only:
#   - JavaScriptKit builds cleanly on macOS.
#   - Ubuntu's `swift-actions/setup-swift` does not include the
#     wasm32 SDK out of the box. Linux comes when JavaScriptKit's
#     wasm32 SDK is reliably available on `ubuntu-latest` (Phase
#     0.5+ when the renderer/bridge deliverable lands).
#   - A wasm32 build step is added in the same change that adds
#     the renderer/bridge deliverable; doing it now would just
#     produce a workflow that always fails on every PR.
#
# Changelog:
#   - 2026-06-11: drop `swift-actions/setup-swift` in favour of a
#     direct .pkg install from download.swift.org. `setup-swift@v3`
#     shells out to `swiftly install`, which crashes on the
#     `macos-14` runner ("freed pointer was not the last
#     allocation") and silently leaves the pre-installed 5.10 in
#     place. `setup-swift@v2` tops out at Swift 5.10. The direct
#     .pkg install is deterministic, exact-pinned, and decoupled
#     from either action's Node / swiftly quirks. Future Swift
#     bumps are a one-line change in `SWIFT_VERSION` below.
#   - 2026-06-11 (earlier): Swift 5.10 -> 6.0 paired with
#     JavaScriptKit 0.23+ (later bumped to exact 0.54.1). Swift
#     5.10 does not ship `Testing` as a first-party module;
#     Swift 6.0 is the line where `import Testing` resolves to
#     the stdlib without a third-party `swift-testing` dep.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Swift version this matrix runs.
  # Bump in lockstep with Package.swift's `swift-tools-version`
  # (currently `6.0`) and with the JavaScriptKit pin (currently
  # `exact: "0.54.1"`). See AGENTS.md §1 + the JavaScriptKit 0.x
  # memory entry for the bump checklist.
  SWIFT_VERSION: "6.0"
  # Path under download.swift.org for the official .pkg installer.
  # Substituted into the URL below.
  SWIFT_PKG_BASENAME: "swift-6.0-RELEASE-osx.pkg"

jobs:
  host:
    # NOTE: job names cannot reference `env.` — `env.` is only
    # available inside a step at runtime, but job names are
    # evaluated at workflow-load time. The Swift version is
    # duplicated here for the job name only; the canonical
    # value is `env.SWIFT_VERSION` below. Bump both together.
    name: host (macos-14, Swift 6.0)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift ${{ env.SWIFT_VERSION }} (direct .pkg)
        # We bypass `swift-actions/setup-swift` on purpose:
        #   - @v2 tops out at Swift 5.10.
        #   - @v3 shells out to `swiftly install`, which crashes on
        #     macos-14 with "freed pointer was not the last
        #     allocation" and silently leaves the pre-installed
        #     5.10 toolchain in place.
        # The official .pkg installer is deterministic and exactly
        # pins the toolchain we want. ~1.4 GB download; the runner
        # has 1 Gbps egress and this finishes in ~15 s.
        run: |
          set -euxo pipefail
          SWIFT_PKG_URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/${SWIFT_PKG_BASENAME}"
          curl --fail --silent --show-error --location \
            -o /tmp/swift.pkg "${SWIFT_PKG_URL}"
          sudo installer -pkg /tmp/swift.pkg -target /
          # The .pkg installs to /usr/share/swift/usr/bin; put it on
          # PATH for subsequent steps. $GITHUB_PATH is the Actions
          # way to persist an env tweak across steps in the same job.
          echo "/usr/share/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Cache SwiftPM build artifacts
        # Best-effort cache keyed on the resolved package set +
        # the SWIFT_VERSION env. Dependency bumps and toolchain
        # bumps invalidate.
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ env.SWIFT_VERSION }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ env.SWIFT_VERSION }}-

      - name: Show toolchain
        # Hardened: set -euxo pipefail so a future silent step
        # failure surfaces as exit 1 instead of swallowing the
        # error. AGENTS.md §10 expects this kind of explicit
        # diagnostic in CI.
        run: |
          set -euxo pipefail
          swift --version
          xcode-select -p
          sw_vers

      - name: Path-hygiene guard
        # AGENTS.md §10: tracked docs must use repo-relative paths
        # only. The guard returns non-zero on any forbidden pattern.
        # Owned by swiftwebui-tooling.
        run: bash scripts/lint-paths.sh

      - name: swift build (host)
        run: swift build

      - name: swift test (host)
        # `swift test` exits non-zero on any test failure. We do
        # not pipe the output through grep/jq/etc. to avoid
        # silently masking failures behind a broken pipe.
        run: swift test
